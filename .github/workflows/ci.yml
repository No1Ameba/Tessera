name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  # Linux (Ubuntu) — apt
  # ---------------------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            libcjson-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libgl1-mesa-dev \
            libx11-dev \
            pkg-config

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # macOS — brew
  # ---------------------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install \
            cmake ninja \
            cjson \
            freetype \
            harfbuzz \
            pkg-config

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Windows — MSVC compile-check of the platform leaf backends.
  #
  # A full Windows build is not yet possible: the daemon (ipc_server.c) is bound
  # to epoll and needs an IOCP port first. This job therefore only compiles the
  # three Windows platform sources (ConPTY / Named Pipe / ReadDirectoryChangesW)
  # with cl /c to verify they build against the Windows SDK and that
  # tessera_pty.h is Windows-valid. Their #includes are all source-relative, so
  # no cJSON / FreeType / vcpkg are needed here.
  # ---------------------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC (cl on PATH)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile-check Windows platform backends
        shell: cmd
        run: |
          cl /c /W3 /nologo src\platform\windows\pty_win.c /Fo:pty_win.obj || exit /b 1
          cl /c /W3 /nologo src\platform\windows\ipc_win.c /Fo:ipc_win.obj || exit /b 1
          cl /c /W3 /nologo src\platform\windows\fs_watch_win.c /Fo:fswatch_win.obj || exit /b 1
